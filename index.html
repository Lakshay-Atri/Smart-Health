<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Smart Health Control Centre - District Operational Dashboard</title>
    <meta name="description" content="District-wide health centre control dashboard. Monitor inventory levels, patient footfalls, doctor attendance, and critical resources in real-time." />
    
    <!-- Prefetch and load fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="h-full">
    <div id="root" class="h-full">
      <!-- Premium Health Heartbeat Preloader -->
      <div id="app-preloader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; font-family: 'Outfit', sans-serif;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 90px; height: 90px;">
          <!-- Pulsing Ring -->
          <div style="position: absolute; width: 100%; height: 100%; border-radius: 50%; background-color: #6366f1; opacity: 0.15; animation: pulse-ring 2s cubic-bezier(0.215, 0.610, 0.355, 1) infinite;"></div>
          <!-- Pulse Center Card with Heart Icon -->
          <div style="display: flex; align-items: center; justify-content: center; width: 55px; height: 55px; border-radius: 50%; background-color: #6366f1; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); animation: heartbeat 1.2s ease-in-out infinite;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 26px; height: 26px;">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
          </div>
        </div>
        <h2 style="margin-top: 24px; font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.025em; text-align: center;">Smart Health</h2>
        <p style="margin-top: 6px; font-size: 11px; font-weight: 700; color: #6366f1; text-transform: uppercase; letter-spacing: 0.15em; text-align: center;">Connecting to Dashboard...</p>
      </div>

      <!-- Styles for Preloader animations -->
      <style>
        @keyframes pulse-ring {
          0% { transform: scale(0.6); opacity: 0.8; }
          100% { transform: scale(1.3); opacity: 0; }
        }
        @keyframes heartbeat {
          0% { transform: scale(0.92); }
          25% { transform: scale(1.08); }
          40% { transform: scale(0.96); }
          55% { transform: scale(1.08); }
          70% { transform: scale(0.92); }
          100% { transform: scale(0.92); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
